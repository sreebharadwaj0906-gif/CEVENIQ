  <body>
    <div id="root"></div>
    <script>
      (function () {
        function removeBadge() {
          var selectors = [
            '#replit-badge-container',
            '[id*="replit-badge"]',
            '[class*="replit-badge"]',
            'iframe[src*="replit"]',
            'iframe[src*="badge"]',
          ];
          selectors.forEach(function (sel) {
            document.querySelectorAll(sel).forEach(function (el) { el.remove(); });
          });
          // Remove any iframe appended directly to body that isn't the app
          document.querySelectorAll('body > iframe').forEach(function (el) { el.remove(); });
        }
        removeBadge();
        var observer = new MutationObserver(removeBadge);
        observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
      })();
    </script>
